[project]
name = "pecuaria-dados"
version = "0.1.0"
description = "Pipeline de dados públicos do IBGE sobre rebanhos (Pesquisa da Pecuária Municipal): ETL, API e painel"
readme = "README.md"
license = "MIT"
authors = [{ name = "Weslley Caxeta" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "httpx>=0.28",
    "pandas>=2.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "tenacity>=9.1",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
painel = ["streamlit>=1.50"]

[project.scripts]
pecuaria-etl = "pecuaria_dados.etl:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pecuaria_dados"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "PL", "C4", "DTZ", "RET"]
# N818: exceções seguem o padrão em português com prefixo "Erro" (ErroExtracao), não o sufixo "Error"
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "altair.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["banco: testes que precisam de PostgreSQL (TEST_DATABASE_URL)"]
filterwarnings = [
    "error",
    # Aviso do próprio TestClient do Starlette sobre a migração futura para httpx2
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["pecuaria_dados"]
# Interface Streamlit: validada no teste de ponta a ponta, não em teste unitário
omit = ["*/painel.py"]
